[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtflow"
version = "0.3.0"
description = "GTFlow grounded theory pipeline with OpenAI-protocol compatibility and a visual UI"
authors = [{name="zw"}]
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["grounded-theory", "qualitative-research", "gioia-method", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "openai>=1.40.0",
  "anthropic>=0.33.0",
  "pydantic>=2.7.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "jinja2>=3.1.3",
  "requests>=2.32.3",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "json-repair==0.44.1; python_version < '3.10'",
  "json-repair>=0.54.0; python_version >= '3.10'"
]

[project.urls]
Homepage = "https://github.com/zw-zhtlab/GTFlow"
Repository = "https://github.com/zw-zhtlab/GTFlow"
Issues = "https://github.com/zw-zhtlab/GTFlow/issues"

[project.scripts]
gtflow = "gtflow.cli:app"
gtflow-ui = "gtflow.gui.launcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [""]
include = ["gtflow*"]

[tool.setuptools.package-data]
gtflow = [
  "gui/static/*",
  "prompts/*.yaml",
]
